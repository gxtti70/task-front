<div class="premium-overlay" (click)="onDismiss()">
  <div appFocusTrap class="premium-dialog flex w-full max-w-xl flex-col overflow-hidden" role="dialog" aria-modal="true" aria-labelledby="task-modal-title" (click)="$event.stopPropagation()">
    <div class="premium-dialog-header flex items-center justify-between gap-2 px-4 py-4 sm:px-6 sm:py-5">
      <h2 class="text-sm font-semibold tracking-tight text-white flex items-center gap-2">
        <lucide-icon name="sliders" class="h-4 w-4 text-indigo-300"></lucide-icon>
        <span id="task-modal-title">
        {{ task ? 'Editar tarea' : 'Crear nuevo item de trabajo' }}
        </span>
      </h2>
      <button type="button" (click)="onDismiss()" aria-label="Cerrar" class="premium-icon-button">
        <lucide-icon name="x" class="h-4 w-4"></lucide-icon>
      </button>
    </div>

    <form (ngSubmit)="onSubmit()" class="flex min-h-0 flex-1 flex-col">
      <div class="min-h-0 flex-1 space-y-4 overflow-y-auto p-4 sm:p-6">
      <div>
        <label class="block text-[11px] font-medium text-zinc-400 uppercase tracking-wider mb-1.5">Título del Item</label>
        <input type="text" name="title" [(ngModel)]="title" maxlength="255" placeholder="p.ej., Implementar interceptor de refresco JWT"
               class="premium-control w-full text-sm" required>
      </div>

      <div>
        <label class="block text-[11px] font-medium text-zinc-400 uppercase tracking-wider mb-1.5">Descripción de criterio de aceptación</label>
        <textarea name="description" [(ngModel)]="description" rows="3" maxlength="2000" placeholder="Detalla el alcance técnico de la tarea..."
                  class="premium-control w-full resize-none text-sm"></textarea>
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label class="block text-[11px] font-medium text-zinc-400 uppercase tracking-wider mb-1.5">Prioridad de Negocio</label>
          <select name="priority" [(ngModel)]="priority"
                  class="premium-control w-full text-sm">
            <option value="LOW">Baja (Low)</option>
            <option value="MEDIUM">Media (Medium)</option>
            <option value="HIGH">Alta (High)</option>
            <option value="URGENT">Urgente (Urgent)</option>
          </select>
        </div>

        <div>
          <label class="block text-[11px] font-medium text-zinc-400 uppercase tracking-wider mb-1.5">Estado Inicial de Flujo</label>
          <select name="status" [(ngModel)]="status"
                  class="premium-control w-full text-sm">
            <option value="TODO">Por Hacer</option>
            <option value="IN_PROGRESS">En Progreso</option>
            <option value="REVIEW">En Revisión</option>
            <option value="IMPEDIMENT">Bloqueado</option>
            <option value="DONE">Finalizado</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-[11px] font-medium text-zinc-400 uppercase tracking-wider mb-1.5" for="taskDueDate">Fecha de vencimiento</label>
        <input id="taskDueDate" type="date" name="dueDate" [(ngModel)]="dueDate"
               class="premium-control w-full text-sm">
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label class="block text-[11px] font-medium text-zinc-400 uppercase tracking-wider mb-1.5">Story Points (Fibonacci)</label>
          <input type="number" name="storyPoints" [(ngModel)]="storyPoints" min="0" max="21"
                 class="premium-control w-full text-sm">
        </div>

        <div>
          <label class="block text-[11px] font-medium text-zinc-400 uppercase tracking-wider mb-1.5">Etiquetas (Separadas por coma)</label>
          <input type="text" name="tagsString" [(ngModel)]="tagsString" placeholder="Frontend, Core, Security"
                 class="premium-control w-full text-sm">
        </div>
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label class="block text-[11px] font-medium text-zinc-400 uppercase tracking-wider mb-1.5">Proyecto</label>
          <select name="projectId" [(ngModel)]="projectId"
                  class="premium-control w-full text-sm">
            <option value="">Sin proyecto</option>
            @for (project of projects(); track project.id) {
              <option [value]="project.id">{{ project.name }}</option>
            }
          </select>
        </div>
        <div>
          <label class="block text-[11px] font-medium text-zinc-400 uppercase tracking-wider mb-1.5">Asignar a</label>
          <select name="assigneeId" [(ngModel)]="assigneeId"
                  class="premium-control w-full text-sm">
            <option value="">Yo</option>
            @for (user of users(); track user.id) {
              <option [value]="user.id">{{ user.name || user.email }}</option>
            }
          </select>
        </div>
      </div>

      </div>
      <div class="flex shrink-0 flex-col-reverse gap-2 border-t border-white/[0.07] bg-zinc-950/70 px-4 py-3 pb-[max(0.75rem,env(safe-area-inset-bottom))] sm:flex-row sm:items-center sm:justify-end sm:gap-3 sm:px-6 sm:py-4 sm:pb-4">
        <button type="button" (click)="onDismiss()"
                class="premium-secondary-button w-full sm:w-auto">
          Cancelar
        </button>
        <button type="submit"
                class="premium-primary-button w-full sm:w-auto">
          {{ task ? 'Guardar cambios' : 'Crear Item' }}
        </button>
      </div>
    </form>
  </div>
</div>
