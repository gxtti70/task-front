<div class="relative flex min-h-dvh items-center justify-center overflow-hidden bg-background px-4 py-8">
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,rgba(24,24,27,0.5),transparent)] pointer-events-none"></div>

  <div class="w-full max-w-md bg-zinc-900/50 border border-zinc-800 p-6 sm:p-8 rounded-2xl shadow-2xl glass-panel animate-slide-in">
    <div class="flex flex-col items-center mb-8">
      <div class="h-10 w-10 bg-white rounded-lg flex items-center justify-center mb-3 shadow-md">
        <lucide-icon name="layers" class="text-black h-5 w-5"></lucide-icon>
      </div>
      <h1 class="text-2xl font-semibold tracking-tight text-white">Bienvenido a TaskManager</h1>
      <p class="text-sm text-zinc-400 mt-1">Introduce tus credenciales para continuar</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-zinc-300 uppercase tracking-wider mb-1.5">Email</label>
        <input type="email" name="email" [(ngModel)]="email" placeholder="usuario@empresa.com"
          class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-zinc-500 transition-colors" required>
      </div>

      <div>
        <label class="block text-xs font-medium text-zinc-300 uppercase tracking-wider mb-1.5">Contraseña</label>
        <input type="password" name="password" [(ngModel)]="password" placeholder="••••••••"
          class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-zinc-500 transition-colors" required>
      </div>

      <button type="submit" [disabled]="isLoading()"
        class="w-full bg-white hover:bg-zinc-200 text-black text-sm font-medium py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed mt-6">
        @if (isLoading()) {
          <div class="h-4 w-4 border-2 border-black border-t-transparent rounded-full animate-spin"></div>
        } @else {
          Iniciar Sesión
        }
      </button>
    </form>

    <div class="my-5 flex items-center gap-3 text-[10px] uppercase tracking-wider text-zinc-600">
      <span class="h-px flex-1 bg-zinc-800"></span><span>o continúa con</span><span class="h-px flex-1 bg-zinc-800"></span>
    </div>
    <button type="button" (click)="onGoogleLogin()" [disabled]="isLoading()"
      class="flex w-full items-center justify-center gap-3 rounded-lg border border-zinc-700 bg-white px-3.5 py-2.5 text-sm font-medium text-zinc-800 transition-colors hover:bg-zinc-100 disabled:opacity-50">
      <svg aria-hidden="true" viewBox="0 0 48 48" class="h-4 w-4"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z"/><path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44Z"/><path fill="#FBBC05" d="M12.6 27.6a12 12 0 0 1 0-7.2v-5.3H5.8a20 20 0 0 0 0 17.8l6.8-5.3Z"/><path fill="#EA4335" d="M24 12c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6 29.5 4 24 4A20 20 0 0 0 5.8 15.1l6.8 5.3C14.2 15.6 18.7 12 24 12Z"/></svg>
      Continuar con Google
    </button>

    <div class="mt-4 text-center">
      <a routerLink="/auth/forgot-password" class="text-xs text-zinc-500 hover:text-zinc-300 transition-colors">¿Olvidaste tu contraseña?</a>
    </div>

    <div class="mt-6 text-center">
      <p class="text-xs text-zinc-500">
        ¿No tienes cuenta?
        <a routerLink="/auth/register" class="text-zinc-300 hover:text-white transition-colors underline underline-offset-4">Regístrate gratis</a>
      </p>
    </div>
  </div>
</div>
