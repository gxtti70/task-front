<div class="min-h-screen flex items-center justify-center bg-background px-4">
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,rgba(24,24,27,0.5),transparent)] pointer-events-none"></div>

  <div class="w-full max-w-md bg-zinc-900/50 border border-zinc-800 p-8 rounded-2xl shadow-2xl glass-panel animate-slide-in">
    <div class="flex flex-col items-center mb-8">
      <div class="h-10 w-10 bg-white rounded-lg flex items-center justify-center mb-3 shadow-md">
        <lucide-icon name="layers" class="text-black h-5 w-5"></lucide-icon>
      </div>
      <h1 class="text-2xl font-semibold tracking-tight text-white">Crea tu Workspace</h1>
      <p class="text-sm text-zinc-400 mt-1">Comienza tu gestión ágil en segundos</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-zinc-300 uppercase tracking-wider mb-1.5">Nombre Completo</label>
        <input type="text" name="name" [(ngModel)]="name" placeholder="Nombre Completo"
          class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-zinc-500 transition-colors" required>
      </div>

      <div>
        <label class="block text-xs font-medium text-zinc-300 uppercase tracking-wider mb-1.5">Email corporativo</label>
        <input type="email" name="email" [(ngModel)]="email" placeholder="Ingresa Correo Corporativo"
          class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-zinc-500 transition-colors" required>
      </div>

      <div>
        <label class="block text-xs font-medium text-zinc-300 uppercase tracking-wider mb-1.5">Contraseña</label>
        <input type="password" name="password" [(ngModel)]="password" placeholder="••••••••"
          class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-zinc-500 transition-colors" required>
      </div>

      <button type="submit" [disabled]="isLoading()"
        class="w-full bg-white hover:bg-zinc-200 text-black text-sm font-medium py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed mt-6">
        @if (isLoading()) {
          <div class="h-4 w-4 border-2 border-black border-t-transparent rounded-full animate-spin"></div>
        } @else {
          Crear cuenta
        }
      </button>
    </form>

    <div class="mt-6 text-center">
      <p class="text-xs text-zinc-500">
        ¿Ya tienes cuenta?
        <a routerLink="/auth/login" class="text-zinc-300 hover:text-white transition-colors underline underline-offset-4">Inicia sesión</a>
      </p>
    </div>
  </div>
</div>
