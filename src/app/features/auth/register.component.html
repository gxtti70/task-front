<div class="relative flex min-h-dvh items-center justify-center overflow-x-hidden bg-background px-4 py-8">
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,rgba(24,24,27,0.5),transparent)] pointer-events-none"></div>

  <div class="premium-dialog max-h-none w-full max-w-md overflow-y-auto p-6 sm:p-8 animate-slide-in">
    <div class="flex flex-col items-center mb-8">
      <div class="h-10 w-10 bg-white rounded-lg flex items-center justify-center mb-3 shadow-md">
        <lucide-icon name="layers" class="text-black h-5 w-5"></lucide-icon>
      </div>
      <h1 class="text-2xl font-semibold tracking-tight text-white">Crea tu Workspace</h1>
      <p class="text-sm text-zinc-400 mt-1">Comienza tu gestión ágil en segundos</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-zinc-300 uppercase tracking-wider mb-1.5">Nombre Completo</label>
        <input type="text" name="name" [(ngModel)]="name" placeholder="Nombre Completo" autocomplete="name" maxlength="100"
          class="premium-control w-full text-sm" required>
      </div>

      <div>
        <label class="block text-xs font-medium text-zinc-300 uppercase tracking-wider mb-1.5">Email corporativo</label>
        <input type="email" name="email" [(ngModel)]="email" placeholder="Ingresa Correo Corporativo" autocomplete="email"
          class="premium-control w-full text-sm" required>
      </div>

      <div>
        <label class="block text-xs font-medium text-zinc-300 uppercase tracking-wider mb-1.5">Contraseña</label>
        <input type="password" name="password" [(ngModel)]="password" placeholder="••••••••" autocomplete="new-password"
          class="premium-control w-full text-sm" required>
      </div>

      <div class="space-y-2 pt-1">
        <label class="flex items-start gap-2 text-xs text-zinc-400 cursor-pointer">
          <input type="checkbox" name="acceptTerms" [(ngModel)]="acceptTerms" required
            class="mt-0.5 h-3.5 w-3.5 rounded border-zinc-600 bg-zinc-800 accent-white">
          <span>Acepto los
            <a routerLink="/legal/terminos" target="_blank" rel="noopener"
              class="text-zinc-200 underline underline-offset-4 hover:text-white">Términos y Condiciones</a>.
          </span>
        </label>
        <label class="flex items-start gap-2 text-xs text-zinc-400 cursor-pointer">
          <input type="checkbox" name="acceptPrivacy" [(ngModel)]="acceptPrivacy" required
            class="mt-0.5 h-3.5 w-3.5 rounded border-zinc-600 bg-zinc-800 accent-white">
          <span>He leído y acepto la
            <a routerLink="/legal/privacidad" target="_blank" rel="noopener"
              class="text-zinc-200 underline underline-offset-4 hover:text-white">Política de Tratamiento de Datos Personales</a>.
          </span>
        </label>
      </div>

      <button type="submit" [disabled]="isLoading()"
        class="premium-primary-button mt-6 w-full text-sm disabled:cursor-not-allowed">
        @if (isLoading()) {
          <div class="h-4 w-4 border-2 border-black border-t-transparent rounded-full animate-spin"></div>
        } @else {
          Crear cuenta
        }
      </button>
    </form>

    <div class="my-5 flex items-center gap-3 text-[10px] uppercase tracking-wider text-zinc-600">
      <span class="h-px flex-1 bg-zinc-800"></span><span>o regístrate con</span><span class="h-px flex-1 bg-zinc-800"></span>
    </div>
    <button type="button" (click)="onGoogleRegister()" [disabled]="isLoading()"
      class="flex w-full items-center justify-center gap-3 rounded-lg border border-zinc-700 bg-white px-3.5 py-2.5 text-sm font-medium text-zinc-800 transition-colors hover:bg-zinc-100 disabled:opacity-50">
      <svg aria-hidden="true" viewBox="0 0 48 48" class="h-4 w-4"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z"/><path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44Z"/><path fill="#FBBC05" d="M12.6 27.6a12 12 0 0 1 0-7.2v-5.3H5.8a20 20 0 0 0 0 17.8l6.8-5.3Z"/><path fill="#EA4335" d="M24 12c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6 29.5 4 24 4A20 20 0 0 0 5.8 15.1l6.8 5.3C14.2 15.6 18.7 12 24 12Z"/></svg>
      Registrarse con Google
    </button>

    <div class="mt-6 text-center">
      <p class="text-xs text-zinc-500">
        ¿Ya tienes cuenta?
        <a routerLink="/auth/login" class="text-zinc-300 hover:text-white transition-colors underline underline-offset-4">Inicia sesión</a>
      </p>
    </div>
  </div>
</div>
