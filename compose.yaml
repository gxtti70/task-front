services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskmanager_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taskmanager_local_only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - taskmanager_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskmanager_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../task-back
      dockerfile_inline: |
        FROM maven:3.9-eclipse-temurin-17 AS build
        WORKDIR /build
        COPY pom.xml .
        COPY src ./src
        RUN mvn -B -DskipTests package
        FROM eclipse-temurin:17-jre
        RUN apt-get update && apt-get install -y --no-install-recommends curl && rm -rf /var/lib/apt/lists/*
        WORKDIR /app
        COPY --from=build /build/target/taskmanager-*.jar app.jar
        EXPOSE 8080
        ENTRYPOINT ["java", "-jar", "/app/app.jar"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/taskmanager_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-taskmanager_local_only}
      JWT_SECRET: ${JWT_SECRET:-local-only-signing-key-change-before-deployment-0123456789abcdef}
      CORS_ALLOWED_ORIGINS: http://localhost:4300,http://127.0.0.1:4201
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  frontend:
    container_name: taskmanager-local-frontend
    build:
      context: .
      dockerfile_inline: |
        FROM node:22-alpine
        WORKDIR /app
        COPY package*.json ./
        RUN npm install --global npm@11.6.1 && npm ci --no-audit --no-fund
        COPY . .
        EXPOSE 4200
        CMD ["npm", "run", "start", "--", "--host", "0.0.0.0", "--port", "4200", "--proxy-config", "proxy.docker.conf.json"]
    ports:
      - "127.0.0.1:4300:4200"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  taskmanager_pgdata:
