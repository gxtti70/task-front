services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskmanager_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - taskmanager_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskmanager_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../task-back
      dockerfile_inline: |
        FROM maven:3.9-eclipse-temurin-17 AS build
        WORKDIR /build
        COPY pom.xml .
        COPY src ./src
        RUN mvn -B -DskipTests package
        FROM eclipse-temurin:17-jre
        RUN apt-get update && apt-get install -y --no-install-recommends curl && rm -rf /var/lib/apt/lists/*
        WORKDIR /app
        COPY --from=build /build/target/taskmanager-*.jar app.jar
        EXPOSE 8080
        ENTRYPOINT ["java", "-jar", "/app/app.jar"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/taskmanager_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      # Desarrollo local: baselina volúmenes heredados sin historial Flyway. Producción usa baseline manual.
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      JWT_COOKIE_SAME_SITE: ${JWT_COOKIE_SAME_SITE:-Lax}
      JWT_COOKIE_DOMAIN: ${JWT_COOKIE_DOMAIN:-}
      CORS_ALLOWED_ORIGINS: http://localhost:4300,http://127.0.0.1:4201
      BILLING_SIMULATE: ${BILLING_SIMULATE:-true}
      ATTACHMENTS_LOCAL_DIRECTORY: /app/data/attachments
      ATTACHMENTS_S3_BUCKET: ${ATTACHMENTS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PREMIUM_PRICE: ${STRIPE_PREMIUM_PRICE:-}
      STRIPE_PLUS_PRICE: ${STRIPE_PLUS_PRICE:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4300}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:4300/login/oauth2/code/google}
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - taskmanager_attachments:/app/data/attachments
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  frontend:
    container_name: taskmanager-local-frontend
    build:
      context: .
      dockerfile_inline: |
        FROM node:22-alpine
        WORKDIR /app
        ARG STRIPE_PUBLISHABLE_KEY
        ENV STRIPE_PUBLISHABLE_KEY=$STRIPE_PUBLISHABLE_KEY
        COPY package*.json ./
        RUN npm install --global npm@11.6.1 && npm ci --no-audit --no-fund
        COPY . .
        EXPOSE 4200
        CMD ["npm", "run", "start", "--", "--host", "0.0.0.0", "--port", "4200", "--proxy-config", "proxy.docker.conf.json"]
      args:
        STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    ports:
      - "127.0.0.1:4300:4200"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  taskmanager_pgdata:
  taskmanager_attachments:
